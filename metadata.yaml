name: astrbot_plugin_gaijin_market_watcher
display_name: Gaijin 市场行情监控与自动交易
help: 发送 /login 登录；发送 /gjm help 查看行情与拥有者自动交易指令。
short_desc: Gaijin 市场行情监控与拥有者自动交易，含模拟盘、资金限额和 WebUI 控制台
desc: |
  监控 Gaijin Market（trade.gaijin.net）上物品的实时最低售价、最高求购价与挂单量，
  变化时推送到群聊或私聊。

  特性：
  - 会话级多用户订阅：同一用户可在不同群聊或私聊独立订阅
  - 群聊全量快照：按固定间隔合并群内全部物品并分别 @ 订阅者
  - 价格折线图：自动推送最近 N 次最低售价与最高求购
  - 多平台适配：适配微信/qq平台
  - 自动交易：拥有者私聊或 WebUI 管理，默认模拟，二次确认后实盘
  - 交易安全：固定 15% 手续费、全局预算、每日限额、急停与订单对账
version: 2.18.0
